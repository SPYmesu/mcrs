[package]
name = "mcrs_minecraft_gui_atlas"
description = "The GUI atlas of a resource pack: the sprites, the textures and the font pages stitched into one Bevy image, with the stitch requests and the image handles"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
mcrs_minecraft_font = { workspace = true, features = ["bevy"] }
mcrs_minecraft_resource.workspace = true
mcrs_minecraft_resource_pack.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu-types.workspace = true
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_image",
] }

[dev-dependencies]
mcrs_minecraft_client_jar.workspace = true
mcrs_minecraft_model = { workspace = true, features = ["test-support"] }
